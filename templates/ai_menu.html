{% extends "base.html" %}
{% block title %}今晚吃什么 · 我们的小窝{% endblock %}
{% block content %}
<div class="menu-editor"><header class="page-head center"><span class="eyebrow">DINNER FOR TWO</span><h1 class="page-title">今晚吃什么</h1><p class="page-subtitle">告诉我人数和今天想吃的味道，从家里的食谱里安排一顿饭。</p></header>
<section class="paper-sheet menu-prompt"><form method="POST"><div class="field-grid"><div class="field"><label for="people_count">今晚有几个人</label><input id="people_count" name="people_count" type="text" list="people_options" value="2人"><datalist id="people_options"><option value="1人"><option value="2人"><option value="3-4人"><option value="5人以上"></datalist></div><div class="field"><label for="preferences">今天想吃什么感觉</label><input id="preferences" name="preferences" type="text" placeholder="例如：清淡一点，有汤，不要香菜"></div></div><button class="primary-action full-action" type="submit"><i data-lucide="chef-hat"></i>替我们写一张菜单</button></form></section>
{% if result %}<article class="paper-sheet menu-result" data-reveal><div class="chapter-heading"><div><span class="eyebrow">TONIGHT'S MENU</span><h2>今晚的手写菜单</h2></div><div class="question-menu"><button class="icon-button" type="button" data-toggle-menu="menuActions" aria-expanded="false" aria-label="菜单更多操作"><i data-lucide="more-horizontal"></i></button><div id="menuActions" class="question-menu-panel" data-menu-panel hidden><button class="text-action" type="button" onclick="window.print()"><i data-lucide="printer"></i>打印菜单</button><a class="text-action" href="{{ url_for('ai_menu') }}"><i data-lucide="rotate-ccw"></i>重新填写</a></div></div></div><div class="prose-paper">{{ result | safe }}</div></article>{% endif %}
<p class="utility-links"><a href="{{ url_for('recipes_list') }}"><i data-lucide="book-open"></i>翻翻家庭食谱</a><a href="{{ url_for('what_can_i_make') }}"><i data-lucide="search"></i>看看现有食材能做什么</a></p></div>
{% endblock %}
