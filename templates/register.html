{% extends "base.html" %}
{% block title %}创建账号 · 我们的小窝{% endblock %}
{% block content %}
<div class="auth-shell"><section class="auth-cover"><span class="eyebrow auth-eyebrow">PRIVATE JOURNAL</span><h1>创建一本新手账</h1><p class="auth-intro">这里默认只为已有的两位使用者开放。</p><form action="{{ url_for('register') }}" method="POST"><div class="field"><label for="username">名字</label><input id="username" name="username" type="text" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" required></div><button class="primary-action full-action" type="submit"><i data-lucide="bookmark-plus"></i>创建账号</button></form><p class="auth-foot"><a href="{{ url_for('login') }}">已有账号，回到登录</a></p></section></div>
{% endblock %}
