{% extends "base.html" %}
{% block title %}回到我们的小窝{% endblock %}
{% block content %}
<div class="auth-shell"><section class="auth-cover"><span class="tape tape-left" aria-hidden="true"></span><span class="eyebrow auth-eyebrow">PRIVATE JOURNAL</span><h1>欢迎回家</h1><p class="auth-intro">翻开只属于你们两个人的这本手账。</p><form action="{{ url_for('login') }}" method="POST"><div class="field"><label for="username">名字</label><input id="username" name="username" type="text" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="primary-action full-action" type="submit"><i data-lucide="book-open"></i>翻开手账</button></form></section></div>
{% endblock %}
